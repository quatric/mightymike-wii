name: Build Wii

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Wii dev packages
        shell: bash
        # pkg.devkitpro.org returns 403 to GitHub-hosted runners intermittently
        # (a known CDN/rate-limit issue, not specific to this project) -- retry
        # a few times with backoff rather than syncing databases outright,
        # since the base image already ships a reasonably current local DB.
        run: |
          for i in 1 2 3 4 5; do
            dkp-pacman -S --noconfirm --needed wii-dev libfat-ogc wii-opengx wii-cmake general-tools && break
            echo "pacman attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Wii.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Package Homebrew Channel app folder
        shell: bash
        run: |
          APPDIR=dist/apps/mightymike
          mkdir -p "$APPDIR"
          cp build/MightyMike.dol "$APPDIR/boot.dol"
          cp packaging/wii/meta.xml "$APPDIR/meta.xml"
          cp packaging/wii/icon.png "$APPDIR/icon.png"
          cp -r build/Data "$APPDIR/Data"
          cd dist
          zip -r ../mightymike-wii.zip apps

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mightymike-wii
          path: mightymike-wii.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mightymike-wii.zip
          generate_release_notes: true
